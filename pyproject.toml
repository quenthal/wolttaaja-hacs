[project]
name = "wolttaaja-hacs"
version = "0.1.0b1"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = ["pytest-homeassistant-custom-component==0.13.367", "ruff==0.16.9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
